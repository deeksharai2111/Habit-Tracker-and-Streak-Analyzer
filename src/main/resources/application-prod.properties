# Production Profile Configuration

# Database Configuration (use environment variables for production)
spring.datasource.url=${DATABASE_URL:jdbc:sqlite:habits.db}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Security Configuration
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD:admin}

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=${CONTEXT_PATH:/}

# Logging Configuration
logging.level.root=WARN
logging.level.com.example.habittracker=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Thymeleaf Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML

# Email Configuration (use environment variables)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Performance Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Application Configuration
app.analytics.enabled=true
app.notifications.enabled=true
app.api.enabled=true

# CORS Configuration for production
app.api.cors.allowed-origins=${CORS_ORIGINS:https://yourdomain.com}

# Session Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Error Handling
server.error.include-stacktrace=never
server.error.include-message=never 