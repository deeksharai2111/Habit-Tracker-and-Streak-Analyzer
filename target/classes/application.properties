# Database Configuration
spring.datasource.url=jdbc:sqlite:habits.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.h2.console.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.cache=false

# Server Configuration
server.port=8081
server.servlet.context-path=/

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.example.habittracker=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Email Configuration (for notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Application Configuration
app.name=Habit Tracker
app.version=1.0.0
app.description=Advanced Habit Tracking Application

# Analytics Configuration
app.analytics.enabled=true
app.analytics.retention-days=365

# Notification Configuration
app.notifications.enabled=true
app.notifications.daily-reminder=true
app.notifications.weekly-report=true
app.notifications.streak-milestones=true

# API Configuration
app.api.enabled=true
app.api.version=v1
app.api.cors.enabled=true
app.api.cors.allowed-origins=*

# Performance Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

